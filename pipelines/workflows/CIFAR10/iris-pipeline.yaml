apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: cifar10-ml-pipeline
  namespace: pipeline

spec:
  entrypoint: cifar10-pipeline
  serviceAccountName: pipeline-service-account

  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 1Gi

  templates:

  # =========================
  # Main Pipeline
  # =========================
  - name: cifar10-pipeline
    dag:
      tasks:
        - name: train-model
          template: train-model-template


  # =========================
  # Train CNN + MLflow
  # =========================
  - name: train-model-template
    script:
      image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-runtime
      command: [python]
      source: |
        import subprocess
        subprocess.run(["pip", "install", "mlflow",  "mlflow==2.9.2","boto3","torchvision", "-q"], check=True)

        import torch
        import torch.nn as nn
        import torch.optim as optim
        from torchvision import datasets, transforms
        from torch.utils.data import DataLoader

        import mlflow
        import mlflow.pytorch
        from mlflow.tracking import MlflowClient

        print("PIPELINE START")

        device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
        print("Using device:", device)

        # =========================
        # DATA PREPARATION
        # =========================
        transform = transforms.Compose([
            transforms.ToTensor()
        ])

        print("Downloading CIFAR10 dataset")

        train_dataset = datasets.CIFAR10(
            root="/mnt/data",
            train=True,
            download=True,
            transform=transform
        )

        train_loader = DataLoader(
            train_dataset,
            batch_size=64,
            shuffle=True
        )

        # =========================
        # MODEL
        # =========================
        class SimpleCNN(nn.Module):
            def __init__(self):
                super().__init__()

                self.conv = nn.Sequential(
                    nn.Conv2d(3, 32, 3, padding=1),
                    nn.ReLU(),
                    nn.MaxPool2d(2),

                    nn.Conv2d(32, 64, 3, padding=1),
                    nn.ReLU(),
                    nn.MaxPool2d(2)
                )

                self.fc = nn.Sequential(
                    nn.Flatten(),
                    nn.Linear(4096, 128),
                    nn.ReLU(),
                    nn.Linear(128, 10)
                )

            def forward(self, x):
                x = self.conv(x)
                x = self.fc(x)
                return x

        model = SimpleCNN().to(device)

        criterion = nn.CrossEntropyLoss()
        optimizer = optim.Adam(model.parameters(), lr=0.001)

        # =========================
        # MLFLOW
        # =========================
        mlflow.set_tracking_uri("http://mlflow.mlflow.svc.cluster.local:5000")
        mlflow.set_experiment("cifar10-experiment")

        client = MlflowClient()

        REGISTERED_MODEL_NAME = "cifar10-cnn"
        DEPLOY_ALIAS = "staging"

        # =========================
        # TRAINING
        # =========================
        with mlflow.start_run() as run:

            run_id = run.info.run_id

            for epoch in range(3):

                total_loss = 0

                for images, labels in train_loader:

                    images = images.to(device)
                    labels = labels.to(device)

                    optimizer.zero_grad()

                    outputs = model(images)

                    loss = criterion(outputs, labels)

                    loss.backward()

                    optimizer.step()

                    total_loss += loss.item()

                print(f"Epoch {epoch} loss {total_loss}")

                mlflow.log_metric("loss", total_loss, step=epoch)

            # =========================
            # SAVE MODEL
            # =========================
            mlflow.pytorch.log_model(model, "model")

            model_uri = f"runs:/{run_id}/model"

            mv = mlflow.register_model(
                model_uri=model_uri,
                name=REGISTERED_MODEL_NAME
            )

            print("Registered model version:", mv.version)

            client.set_registered_model_alias(
                name=REGISTERED_MODEL_NAME,
                alias=DEPLOY_ALIAS,
                version=mv.version
            )

            print("Model registered and aliased")

    resources:
      requests:
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1

    volumeMounts:
      - name: workdir
        mountPath: /mnt/data